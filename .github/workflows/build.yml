name: Build Windows & Linux Releases

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: "utf-8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libx11-6 libxcursor1 libxrandr2 libxi6 libxxf86vm1 libopenal1
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ursina pyinstaller
      - name: Build Executable with build_game.py
        run: python build_game.py

      - name: Upload Release Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RiskOfPython2-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
